<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hotseat</title>
<style>
  :root {
    --bg: #f6f6f4; --card: #fff; --ink: #1b1b19; --muted: #6d6a64;
    --line: #e2e0da; --accent: #3d6fd1; --ok: #2f7d4f; --warn: #9a6510; --bad: #b4392f;
    --track: #eceae4; --shadow: 0 1px 2px rgba(0,0,0,.06), 0 4px 14px rgba(0,0,0,.04);
    /* Fixed per model family, never per rank, so a family keeps its colour as
       the ordering changes. Validated for colour-vision separation in both modes. */
    --cat-fable: #2a78d6; --cat-opus: #eb6834; --cat-sonnet: #1baf7a;
    --cat-haiku: #eda100; --cat-other: #8d8a83;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #16171a; --card: #1e2024; --ink: #e9e8e4; --muted: #9a978f;
      --line: #2c2f34; --accent: #7aa2f7; --ok: #6cc08b; --warn: #d9a441; --bad: #e2796d;
      --track: #2a2d32; --shadow: none;
      --cat-fable: #3987e5; --cat-opus: #d95926; --cat-sonnet: #199e70;
      --cat-haiku: #c98500; --cat-other: #8d8a83;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font: 15px/1.5 ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    padding: 24px 16px 48px;
  }
  .wrap { max-width: 780px; margin: 0 auto; }
  header { display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; margin-bottom: 4px; }
  h1 { font-size: 20px; margin: 0; letter-spacing: -.01em; }
  .sub { color: var(--muted); font-size: 13px; }
  .bar-top { display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
             margin: 14px 0 20px; }
  button {
    font: inherit; font-size: 13px; padding: 6px 12px; border-radius: 7px;
    border: 1px solid var(--line); background: var(--card); color: var(--ink);
    cursor: pointer;
  }
  button:hover:not(:disabled) { border-color: var(--accent); }
  button:disabled { opacity: .45; cursor: default; }
  button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  button.risky { color: var(--bad); }
  .note { font-size: 13px; color: var(--muted); }
  .note strong { color: var(--ink); }

  .card {
    background: var(--card); border: 1px solid var(--line); border-radius: 11px;
    padding: 16px 18px; margin-bottom: 12px; box-shadow: var(--shadow);
  }
  .card.active { border-color: var(--accent); }
  .row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  .alias { font-weight: 650; font-size: 16px; }
  .pill {
    font-size: 11px; text-transform: uppercase; letter-spacing: .05em;
    padding: 2px 8px; border-radius: 99px; border: 1px solid var(--line); color: var(--muted);
  }
  .pill.active { border-color: var(--accent); color: var(--accent); }
  .pill.ok { border-color: var(--ok); color: var(--ok); }
  .pill.bad { border-color: var(--bad); color: var(--bad); }
  .who { color: var(--muted); font-size: 13px; margin: 3px 0 12px; word-break: break-word; }

  .metric { display: grid; grid-template-columns: 52px 1fr auto; gap: 10px;
            align-items: center; margin-bottom: 7px; font-size: 13px; }
  .metric .label { color: var(--muted); }
  .track { display: block; background: var(--track); border-radius: 99px;
           height: 8px; overflow: hidden; }
  .fill { display: block; height: 100%; min-width: 2px; background: var(--accent);
          border-radius: 99px; transition: width .25s ease; }
  .fill.warn { background: var(--warn); }
  .fill.bad { background: var(--bad); }
  .metric .val { font-variant-numeric: tabular-nums; color: var(--muted); white-space: nowrap; }

  .foot { display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap;
          margin-top: 12px; padding-top: 12px; border-top: 1px solid var(--line);
          font-size: 13px; color: var(--muted); }
  .due.soon { color: var(--bad); font-weight: 600; }
  .actions { display: flex; gap: 7px; flex-wrap: wrap; }
  .err { color: var(--bad); font-size: 13px; margin-top: 8px; }
  .panel { background: var(--card); border: 1px solid var(--line); border-radius: 11px;
           padding: 16px 18px; margin-bottom: 18px; box-shadow: var(--shadow); }
  .panel h2 { font-size: 14px; margin: 0 0 2px; font-weight: 650; }
  .panel .cap { font-size: 12px; color: var(--muted); margin: 0 0 14px; }
  .stack { display: flex; gap: 2px; height: 12px; margin-bottom: 14px; }
  .seg { height: 100%; border-radius: 3px; min-width: 3px; }
  .legend { display: grid; grid-template-columns: auto 1fr auto auto; gap: 4px 10px;
            align-items: center; font-size: 13px; }
  .item { padding: 10px 0; border-top: 1px solid var(--line); }
  .item:first-child { border-top: 0; }
  .item-head { display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap; }
  .item-head .dot { width: 9px; height: 9px; border-radius: 3px; flex: none;
                    align-self: center; }
  .item-head .nm { font-weight: 600; }
  .item-head .meta { color: var(--muted); font-size: 12px; }
  .item-head .st { margin-left: auto; font-size: 12px; text-align: right; }
  .item .path { font-size: 12px; color: var(--muted); margin-top: 3px;
                font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
                overflow-wrap: anywhere; }
  .item .said { font-size: 12px; color: var(--muted); margin-top: 5px;
                border-left: 2px solid var(--line); padding-left: 9px;
                overflow-wrap: anywhere; }
  .item .peek { margin-top: 6px; }
  .item .peek button { font-size: 12px; padding: 2px 9px; }
  .waiting { color: var(--bad); font-weight: 600; font-size: 12px; }
  .legend .peek button { font-size: 12px; padding: 2px 8px; }
  .peeked { grid-column: 1 / -1; background: var(--track); border-radius: 8px;
            padding: 10px 12px; margin: 2px 0 8px; font-size: 13px; }
  .peeked h4 { margin: 0 0 2px; font-size: 12px; color: var(--muted);
               text-transform: uppercase; letter-spacing: .04em; font-weight: 600; }
  .peeked p { margin: 0 0 10px; }
  .peeked p:last-child { margin-bottom: 0; }
  .swatch { width: 10px; height: 10px; border-radius: 3px; }
  .legend .tok { color: var(--muted); font-variant-numeric: tabular-nums; }
  .legend code { font-size: 12px; }
  .panel code { background: var(--track); padding: 1px 5px; border-radius: 4px; }
  .legend .shr { font-variant-numeric: tabular-nums; text-align: right; min-width: 46px; }
  .detail { display: flex; gap: 14px; flex-wrap: wrap; font-size: 12px;
            color: var(--muted); margin-top: 10px; }
  .detail b { font-weight: 600; color: var(--ink); }
  dialog {
    border: 1px solid var(--line); border-radius: 11px; background: var(--card);
    color: var(--ink); max-width: 420px; padding: 20px;
  }
  dialog::backdrop { background: rgba(0,0,0,.45); }
  dialog p { margin: 0 0 14px; font-size: 14px; }
  .dlg-actions { display: flex; gap: 8px; justify-content: flex-end; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Claude accounts</h1>
    <span class="sub" id="updated">loading…</span>
  </header>

  <div class="bar-top">
    <button id="refresh">Refresh</button>
    <span class="note" id="sessions"></span>
  </div>

  <div id="codex"></div>
  <div id="stopped"></div>
  <div id="plugins"></div>
  <div id="models"></div>
  <div id="list"></div>
  <p class="err" id="fatal" hidden></p>
</div>

<dialog id="confirm">
  <p id="confirm-text"></p>
  <div class="dlg-actions">
    <button id="cancel">Cancel</button>
    <button class="primary risky" id="go">Switch anyway</button>
  </div>
</dialog>

<script>
const TOKEN = "__HOTSEAT_TOKEN__";
const list = document.getElementById("list");
const dialog = document.getElementById("confirm");
let caps = {};

const pct = v => v === null || v === undefined ? null : Math.round(v * 100);
function clock(ts) {
  if (!ts) return "—";
  const when = new Date(ts * 1000);
  const time = when.toLocaleTimeString([], {hour: "2-digit", minute: "2-digit"});
  const sameDay = when.toDateString() === new Date().toDateString();
  return sameDay ? time : `${when.toLocaleDateString([], {weekday: "short"})} ${time}`;
}

function ago(seconds) {
  if (seconds < 60) return `${Math.max(0, Math.round(seconds))}s ago`;
  if (seconds < 3600) return `${Math.round(seconds / 60)}m ago`;
  return `${Math.round(seconds / 3600)}h ago`;
}

async function post(path, body) {
  const res = await fetch(path, {
    method: "POST",
    headers: {"Content-Type": "application/json", "X-Hotseat-Token": TOKEN},
    body: JSON.stringify(body || {}),
  });
  const data = await res.json().catch(() => ({error: "bad response"}));
  if (!res.ok) throw new Error(data.error || res.statusText);
  return data;
}

function metric(label, used, resetTs) {
  const p = pct(used);
  const width = p === null ? 0 : Math.max(p > 0 ? 1.5 : 0, Math.min(100, p));
  const tone = p === null ? "" : p >= 100 ? "bad" : p >= 80 ? "warn" : "";
  const value = p === null ? "—" : `${p}%`;
  const reset = resetTs ? ` · resets ${clock(resetTs)}` : "";
  return `<div class="metric">
    <span class="label">${label}</span>
    <span class="track"><span class="fill ${tone}" style="width:${width}%"></span></span>
    <span class="val">${value}${reset}</span>
  </div>`;
}

function detail(a) {
  const u = a.usage;
  if (!u) return "";
  const bits = [];
  if (u.binding) bits.push(`binding limit <b>${u.binding.replace("_", " ")}</b>`);
  if (a.access_hours_left !== null && a.access_hours_left !== undefined)
    bits.push(`token good for <b>${a.access_hours_left.toFixed(1)}h</b>`);
  if (u.overage_status)
    bits.push(`extra usage <b>${u.overage_status === "allowed" ? "on" : (u.overage_reason || "off").replace(/_/g, " ")}</b>`);
  if (u.fallback_at !== null && u.fallback_at !== undefined)
    bits.push(`falls back at <b>${Math.round(u.fallback_at * 100)}%</b>`);
  return bits.length ? `<div class="detail">${bits.map(b => `<span>${b}</span>`).join("")}</div>` : "";
}

function card(a) {
  const u = a.usage;
  const limited = u && u.limited;
  const blocked = (u && u.blocked_models) || [];
  const status = a.error ? "unavailable" : limited ? "rate-limited" : u ? "available" : "unknown";
  const tone = a.error || limited ? "bad" : u ? "ok" : "";
  const due = a.signin_days_left;
  const dueText = due === null || due === undefined ? "—"
    : due <= 0 ? "sign-in overdue" : `sign-in in ${Math.round(due)}d`;

  const canAct = caps.profiles !== false;
  const buttons = [
    canAct ? `<button class="primary" data-act="launch" data-alias="${a.alias}">Launch session</button>` : "",
    `<button data-act="verify" data-alias="${a.alias}">Verify</button>`,
    (canAct && caps.switch && !a.is_active)
      ? `<button class="risky" data-act="switch" data-alias="${a.alias}">Make default</button>` : "",
  ].join("");

  return `<div class="card ${a.is_active ? "active" : ""}">
    <div class="row">
      <span class="alias">${a.alias}</span>
      ${a.plan ? `<span class="pill">${a.plan}</span>` : ""}
      <span class="pill ${tone}">${status}</span>
      ${a.is_active ? `<span class="pill active">active</span>` : ""}
      ${blocked.map(m => `<span class="pill bad" title="weekly limit for this model is spent">no ${m}</span>`).join("")}
    </div>
    <div class="who">${a.email || "unknown account"}${a.org ? " · " + a.org : ""}</div>
    ${metric("5-hour", u && u.used_5h, u && u.reset_5h)}
    ${metric("7-day", u && u.used_7d, u && u.reset_7d)}
    ${((u && u.scoped) || []).map(sc =>
        metric(sc.model, sc.used, sc.reset)).join("")}
    ${detail(a)}
    <div class="foot">
      <span class="due ${a.signin_due_soon ? "soon" : ""}">${dueText}</span>
      <span class="actions">${buttons}</span>
    </div>
    ${a.error ? `<div class="err">${a.error}</div>` : ""}
  </div>`;
}

const FAMILY_COLOR = f => `var(--cat-${["fable","opus","sonnet","haiku"].includes(f) ? f : "other"})`;

function tokens(n) {
  if (n >= 1e9) return `${(n / 1e9).toFixed(1)}B`;
  if (n >= 1e6) return `${(n / 1e6).toFixed(0)}M`;
  if (n >= 1e3) return `${(n / 1e3).toFixed(0)}K`;
  return String(n);
}

function modelPanel(mu) {
  if (!mu || !mu.models || !mu.models.length) return "";
  // A share bar plus a labelled list. The list is the direct labelling, so
  // identity never rests on colour alone.
  // The bar is one segment per family, so no two segments share a colour. Model
  // detail lives in the legend, where it is named rather than colour-coded.
  const byFamily = new Map();
  for (const m of mu.models) {
    const at = byFamily.get(m.family) || {family: m.family, share: 0, names: []};
    at.share += m.share;
    at.names.push(m.label);
    byFamily.set(m.family, at);
  }
  const stack = [...byFamily.values()]
    .sort((a, b) => b.share - a.share)
    .map(f => `<span class="seg" style="flex:${Math.max(f.share, 0.004)};background:${FAMILY_COLOR(f.family)}" title="${f.names.join(", ")} · ${(f.share * 100).toFixed(0)}%"></span>`)
    .join("");
  const rows = mu.models.map(m => `
    <span class="swatch" style="background:${FAMILY_COLOR(m.family)}"></span>
    <span>${m.label}</span>
    <span class="tok">${tokens(m.tokens)}</span>
    <span class="shr">${(m.share * 100).toFixed(m.share < 0.01 ? 1 : 0)}%</span>`).join("");

  const stale = mu.stale ? ` Counts run to ${mu.as_of}, so today is not included yet.` : "";
  return `<div class="panel">
    <h2>Last ${mu.days} days by model</h2>
    <p class="cap">${tokens(mu.total_tokens)} tokens across every account used on this
      machine. Separate from the quota bars below, which are per account and measure
      budget rather than tokens.${stale}</p>
    <div class="stack">${stack}</div>
    <div class="legend">${rows}</div>
  </div>`;
}

const esc = t => String(t == null ? "" : t).replace(/&/g, "&amp;").replace(/</g, "&lt;");
const shortPath = p => !p ? "" : esc(p).replace(/^\/home\/[^/]+/, "~");

function codexPanel(c) {
  if (!c || !c.accounts || !c.accounts.length) return "";
  const rows = c.accounts.map(a => {
    const u = a.usage || {};
    const worst = u.worst_used === null || u.worst_used === undefined
      ? null : Math.round(u.worst_used * 100);
    const word = u.error ? "error" : !a.usage ? "unknown"
      : u.usable ? "usable" : "blocked";
    const colour = word === "usable" ? "ok" : word === "blocked" ? "bad"
      : word === "error" ? "warn" : "muted";
    return `
      <span class="swatch" style="background:var(--${colour})"></span>
      <span>${a.saved ? esc(a.alias) : "live"}${a.is_active ? " · active" : ""}
        ${a.saved ? "" : `<b style="color:var(--warn)">unsaved</b>`}
        <span class="path">${esc(a.email || "?")}</span></span>
      <span class="tok">${esc(a.plan || "")}</span>
      <span class="shr">${worst === null ? "—" : worst + "%"} ${word}</span>`;
  }).join("");

  return `<div class="panel">
    <h2>Codex accounts</h2>
    <p class="cap">Separate quota from the Claude accounts below. An account can hold
      several limit windows at once; the percentage is the highest of them, which is
      the one actually constraining it.
      ${c.quota_read ? "" : " Quota could not be read, so only the accounts are shown."}
      ${c.quota_age_s > 60 ? ` Quota read ${Math.round(c.quota_age_s / 60)} min ago;
        re-reading starts a process per account, so it is not on the refresh timer.` : ""}</p>
    <div class="legend">${rows}</div>
    ${c.unsaved_live ? `<div class="detail"><span style="color:var(--warn)">
      The live account (${esc(c.unsaved_live)}) is not saved as a profile.
      Switching profiles would lose it.</span></div>` : ""}
  </div>`;
}

function stoppedRow(i) {
  const r = i.readiness || {};
  const cause = {queue_paused: "queue paused", usage_limit: "usage limit",
                 waiting_for_account: "waiting for quota"}[i.cause] || "stopped";
  const state = r.hard ? `<span style="color:var(--warn)">${esc(r.hard)}</span>`
    : i.kind === "native" ? `<span class="tok">needs a terminal</span>`
    : `<span style="color:var(--ok)">ready</span>`;
  const when = i.stopped_at
    ? new Date(i.stopped_at * 1000).toLocaleDateString([], {day: "numeric", month: "short"})
    : "—";
  const tone = i.pending ? "bad" : r.hard ? "warn" : "ok";
  return `<div class="item">
    <div class="item-head">
      <span class="dot" style="background:var(--${tone})"></span>
      <span class="nm">${esc(i.name)}</span>
      ${i.pending ? `<span class="waiting">${i.pending} waiting</span>` : ""}
      <span class="meta">${cause} · ${when}</span>
      <span class="st">${state}</span>
    </div>
    ${i.cwd ? `<div class="path">${shortPath(i.cwd)}</div>` : ""}
    ${i.last_message ? `<div class="said">${esc(i.last_message)}</div>` : ""}
    <div class="peek"><button data-peek="${esc(i.id)}">what was it doing?</button></div>
  </div>`;
}

function stoppedPanel(items) {
 if (!items || !items.length) return "";
 return `<div class="panel"><h2>Stopped sessions</h2>${items.map(stoppedRow).join("")}</div>`;
}

function render(snap) {
  caps = snap.capabilities || {};
  document.getElementById("updated").textContent =
    `updated ${ago(Date.now() / 1000 - snap.generated_at)}`;

  const n = snap.sessions || 0;
  document.getElementById("sessions").innerHTML = n
    ? `<strong>${n}</strong> Claude session${n === 1 ? "" : "s"} running. Launching is safe; changing the default retargets all of them.`
    : "No Claude sessions running.";

  const fatal = document.getElementById("fatal");
  fatal.hidden = !snap.error;
  fatal.textContent = snap.error || "";

  document.getElementById("codex").innerHTML = codexPanel(snap.codex);
  document.getElementById("stopped").innerHTML = stoppedPanel(snap.stopped);
  document.getElementById("plugins").innerHTML = (window.hotseatPlugins || []).map(render => render(snap)).join("");
  document.getElementById("models").innerHTML = modelPanel(snap.model_usage);

  list.innerHTML = (snap.accounts || []).map(card).join("")
    || `<p class="note">No accounts found.</p>`;
}

async function load(force) {
  try {
    const snap = force ? await post("/api/refresh") : await (await fetch("/api/snapshot")).json();
    render(snap);
  } catch (err) {
    const fatal = document.getElementById("fatal");
    fatal.hidden = false;
    fatal.textContent = String(err.message || err);
  }
}

document.getElementById("refresh").addEventListener("click", async (e) => {
  e.target.disabled = true;
  e.target.textContent = "Refreshing…";
  await load(true);
  e.target.disabled = false;
  e.target.textContent = "Refresh";
});

document.addEventListener("click", async (e) => {
  const btn = e.target.closest("button[data-peek]");
  if (!btn) return;
  const holder = btn.closest(".peek");
  const open = holder.querySelector(".peeked");
  if (open) { open.remove(); btn.textContent = "what was it doing?"; return; }

  btn.disabled = true;
  btn.textContent = "loading…";
  try {
    const res = await fetch(`/api/inspect/${encodeURIComponent(btn.dataset.peek)}`);
    const d = await res.json();
    if (!res.ok) throw new Error(d.error || res.statusText);
    const section = (title, body) => body
      ? `<h4>${title}</h4><p>${body.replace(/</g, "&lt;")}</p>` : "";
    const queued = (d.queued || [])
      .map(q => section(`queued · ${q.origin || "unknown"}`, q.text)).join("");
    const box = document.createElement("div");
    box.className = "peeked";
    box.innerHTML =
      (d.cwd ? `<h4>working in</h4><p>${d.cwd}${d.branch ? ` (${d.branch})` : ""}</p>` : "")
      + section("what it was working on", d.summary)
      + section("last asked", d.last_user)
      + section("last said", d.last_assistant)
      + queued
      || "<p>No detail was kept for this one.</p>";
    holder.appendChild(box);
    btn.textContent = "hide";
  } catch (err) {
    btn.textContent = `failed: ${err.message || err}`;
  } finally {
    btn.disabled = false;
  }
});

list.addEventListener("click", async (e) => {
  const btn = e.target.closest("button[data-act]");
  if (!btn) return;
  const {act, alias} = btn.dataset;

  if (act === "switch") {
    const n = Number((document.getElementById("sessions").textContent.match(/\d+/) || [0])[0]);
    document.getElementById("confirm-text").textContent =
      `Make ${alias} the machine-wide default? Every Claude session reads the same credential file, so this retargets ${n} running session(s) mid-conversation. Launching a pinned session instead affects nothing.`;
    dialog.returnValue = "";
    dialog.showModal();
    const ok = await new Promise(res => {
      document.getElementById("go").onclick = () => { dialog.close(); res(true); };
      document.getElementById("cancel").onclick = () => { dialog.close(); res(false); };
    });
    if (!ok) return;
  }

  const original = btn.textContent;
  btn.disabled = true;
  btn.textContent = "…";
  try {
    await post(`/api/${act}`, {alias, acknowledged: act === "switch"});
    btn.textContent = act === "verify" ? "✓ live" : "✓";
    await load(false);
  } catch (err) {
    btn.textContent = "failed";
    const fatal = document.getElementById("fatal");
    fatal.hidden = false;
    fatal.textContent = `${alias}: ${err.message || err}`;
  } finally {
    setTimeout(() => { btn.disabled = false; btn.textContent = original; }, 1800);
  }
});

load(false);
setInterval(() => load(false), 15000);
</script>
__HOTSEAT_PLUGIN_SCRIPTS__
</body>
</html>
