[project]
name = "hotseat"
dynamic = ["version"]
description = "Terminal dashboard and CLI for Claude Code and Codex accounts, their quota, and work a usage limit stopped"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
dependencies = []
authors = [{ name = "Maxteabag" }]
keywords = ["claude", "codex", "tui", "quota", "accounts", "terminal"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Go",
    "Topic :: Utilities",
]

[project.urls]
Homepage = "https://github.com/Maxteabag/hotseat"
Changelog = "https://github.com/Maxteabag/hotseat/releases"

[project.scripts]
hotseat = "hotseat.cli:main"

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
include-package-data = false
packages = ["hotseat", "hotseat.backends"]

[tool.setuptools.dynamic]
version = { attr = "hotseat.__version__" }

[tool.setuptools.package-data]
# _bin holds the prebuilt Go TUI in platform wheels; scripts/build_wheels.py fills it.
hotseat = ["web/*.html", "_bin/*"]
