name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  go:
    name: Go
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: gofmt -l cmd internal | tee /dev/stderr | test -z "$(cat)"
      - run: go vet ./...
      - run: go test -race ./...
      - name: Build and render a demo frame
        run: |
          CGO_ENABLED=0 go build -trimpath -o bin/hotseat ./cmd/hotseat
          bin/hotseat --version
          bin/hotseat tui --render --demo-file docs/demo-fixture.json --width 110 --height 30 | head -5

  cross:
    name: Cross-compile ${{ matrix.goos }}/${{ matrix.goarch }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { goos: linux, goarch: amd64 }
          - { goos: linux, goarch: arm64 }
          - { goos: darwin, goarch: amd64 }
          - { goos: darwin, goarch: arm64 }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: CGO_ENABLED=0 GOOS=${{ matrix.goos }} GOARCH=${{ matrix.goarch }} go build -trimpath -o /dev/null ./cmd/hotseat
