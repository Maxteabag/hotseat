name: Release

# Tag a commit `vX.Y.Z` (matching internal/version) and push the tag. GoReleaser
# (.goreleaser.yaml) builds the tarballs, SHA256SUMS, .deb and .rpm packages,
# publishes the GitHub release and pushes the Homebrew formula to
# Maxteabag/homebrew-tap. Re-run for an existing tag with "Run workflow".
#
# Secrets: HOMEBREW_TAP_GITHUB_TOKEN, a token with push access to the tap repo.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to build and publish, e.g. v0.2.1"
        required: true

permissions:
  contents: read

env:
  RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.RELEASE_TAG }}
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Tag must match the binary version
        run: |
          version="$(go run ./cmd/hotseat --version | awk '{print $2}')"
          test "v${version}" = "${RELEASE_TAG}" || { echo "tag ${RELEASE_TAG} != v${version}"; exit 1; }
      - run: gofmt -l cmd internal | tee /dev/stderr | test -z "$(cat)"
      - run: go vet ./... && go test -race ./...
      - uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: v2.18.1  # brews is deprecated upstream in favour of casks, which Linux Homebrew lacks; pin until that is resolved
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HOMEBREW_TAP_GITHUB_TOKEN: ${{ secrets.HOMEBREW_TAP_GITHUB_TOKEN }}
